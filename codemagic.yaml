workflows:
  ios-build:
    name: iOS 编译 & TestFlight
    max_build_duration: 60
    environment:
      flutter: 3.44.4
      xcode: latest
      groups:
        - app_store
    scripts:
      - name: Flutter 依赖
        script: flutter pub get

      - name: 安装证书和 Profile（从仓库文件读取）
        script: |
          set -e
          echo "=== 解码证书 ==="
          cat ios/secrets/cert.p12.base64 | base64 -d > /tmp/cert.p12
          ls -l /tmp/cert.p12

          echo "=== 创建临时 build.keychain ==="
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "=== 导入证书到临时 Keychain ==="
          security import /tmp/cert.p12 \
            -P "Chmchm811" \
            -A \
            -t cert \
            -f pkcs12 \
            -k build.keychain
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "" \
            build.keychain

          echo "=== 验证证书 ==="
          security find-identity -v -p codesigning build.keychain

          echo "=== 解码并安装 Profile ==="
          cat ios/secrets/profile.mobileprovision.base64 | base64 -d > /tmp/profile.mobileprovision
          ls -l /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/"Provisioning Profiles"/
          echo "✅ 证书和 Profile 安装完成"

      - name: 自动配置签名
        script: |
          set -e
          xcode-project use-profiles
          echo "✅ 签名配置完成"

      - name: 构建并导出 IPA
        script: |
          set -e
          flutter build ipa \
            --release \
            --export-options-plist ios/ExportOptions.plist
          echo "✅ IPA 构建完成！"
          ls -lh build/ios/ipa/

      - name: 上传 App Store Connect
        script: |
          set -e
          echo "=== 开始上传 IPA 到 App Store Connect ==="

          # 检查 app-store-connect 命令是否存在
          if ! command -v app-store-connect &> /dev/null; then
            echo "❌ app-store-connect 命令未找到"
            echo "IPA 已构建完成，可以在 artifacts 中下载手动上传"
            exit 1
          fi

          # 动态查找 IPA 文件
          echo "=== 查找 IPA 文件 ==="
          find build/ios -name "*.ipa" -type f 2>/dev/null || true
          IPA_FILE=$(find build/ios -name "*.ipa" -type f 2>/dev/null | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "❌ 未找到任何 .ipa 文件！"
            echo "build/ios 目录内容："
            find build/ios -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "找到 IPA: $IPA_FILE"
          ls -lh "$IPA_FILE"

          # Key ID 和 Issuer ID 硬编码
          KEY_ID="32JV5CQL98"
          ISSUER_ID="c9f20ee8-40c5-4d57-8786-0c9ac016e269"

          echo "Key ID: $KEY_ID"
          echo "Issuer ID: $ISSUER_ID"

          # Private Key: 从仓库文件读取到环境变量
          export API_KEY_CONTENT=$(cat ios/secrets/api_key.p8)

          # 上传
          app-store-connect publish \
            --path "$IPA_FILE" \
            --key-id "$KEY_ID" \
            --issuer-id "$ISSUER_ID" \
            --private-key @env:API_KEY_CONTENT

          echo ""
          echo "✅ IPA 上传成功！请在 TestFlight 页面等待 Apple 处理（通常 15-30 分钟）。"

    artifacts:
      - "build/ios/ipa/*.ipa"
