workflows:
  ios-build:
    name: iOS 编译 & TestFlight
    max_build_duration: 60
    environment:
      flutter: 3.44.4
      xcode: latest
      groups:
        - app_store
    scripts:
      - name: Flutter 依赖
        script: flutter pub get

      - name: 安装证书和 Profile（从仓库文件读取）
        script: |
          set -e
          echo "=== 解码证书 ==="
          cat ios/secrets/cert.p12.base64 | base64 -d > /tmp/cert.p12
          ls -l /tmp/cert.p12

          echo "=== 创建临时 build.keychain ==="
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "=== 导入证书到临时 Keychain ==="
          security import /tmp/cert.p12 \
            -P "Chmchm811" \
            -A \
            -t cert \
            -f pkcs12 \
            -k build.keychain
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "" \
            build.keychain

          echo "=== 验证证书 ==="
          security find-identity -v -p codesigning build.keychain

          echo "=== 解码并安装 Profile ==="
          cat ios/secrets/profile.mobileprovision.base64 | base64 -d > /tmp/profile.mobileprovision
          ls -l /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/"Provisioning Profiles"/
          echo "✅ 证书和 Profile 安装完成"

      - name: 自动配置签名
        script: |
          set -e
          xcode-project use-profiles
          echo "✅ 签名配置完成"

      - name: 构建并导出 IPA
        script: |
          set -e
          flutter build ipa \
            --release \
            --export-options-plist ios/ExportOptions.plist
          echo "✅ IPA 构建完成！"
          ls -lh build/ios/ipa/

      - name: 上传 App Store Connect
        script: |
          set -e
          echo "=== 开始上传 IPA 到 App Store Connect ==="

          app-store-connect publish \
            --path build/ios/ipa/eternity.ipa \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY

          echo ""
          echo "✅ IPA 上传成功！请在 TestFlight 页面手动选择 Build 提交审核。"

    artifacts:
      - "build/ios/ipa/*.ipa"
