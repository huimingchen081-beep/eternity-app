name: eternity
description: "Eternity - Record your life in the universe"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  in_app_purchase: ^3.2.1
  http: ^1.2.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  record: ^5.1.3
  permission_handler: ^11.3.1
  video_player: ^2.9.2
  uuid: ^4.5.1
  flutter_local_notifications: ^18.0.1
  just_audio: ^0.9.42
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/audio/

  generate: true
